name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let in-progress runs finish rather than
# being cancelled mid-deploy, but skip queuing beyond that.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # GitHub Pages project sites (the default here -- see repo: in
      # admin/config.yml) are served from /<repo-name>/, not the domain
      # root. eleventy.config.js rewrites root-absolute links (including
      # ones baked directly into converted Markdown by scripts/convert.py)
      # to match at build time -- see the comment there for why that's
      # done as a transform rather than in the content itself.
      #
      # If this repo is ever renamed to <owner>.github.io (a user/org
      # root site) or given a custom domain, delete this env line --
      # PATH_PREFIX defaults to "/" and no rewriting happens.
      - name: Build site
        run: npm run build
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}

      - name: Build search index
        run: npm run postbuild

      # enablement: true asks the API to create the repo's Pages site if
      # one doesn't exist yet, rather than only reading an existing one --
      # avoids a manual Settings -> Pages -> "Build and deployment: GitHub
      # Actions" step on first deploy. Requires the default GITHUB_TOKEN's
      # `pages: write` permission (already granted above); if this org
      # restricts that, fall back to doing the Settings toggle by hand and
      # this step becomes a no-op (it still reads the existing config).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
